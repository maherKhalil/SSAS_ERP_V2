<div class="flex h-screen bg-gray-50 overflow-hidden">
  <!-- Sidebar -->
  <aside class="w-64 bg-gray-900 text-white flex flex-col transition-all duration-300">
    <div class="h-16 flex items-center px-6 border-b border-gray-800">
      <h1 class="text-xl font-bold tracking-wider text-indigo-400">DreamSERP</h1>
    </div>
    
    <div class="p-4 border-b border-gray-800">
      <div class="text-xs uppercase text-gray-500 font-semibold tracking-wider mb-2">Current Module</div>
      <div class="text-sm font-medium">{{ moduleName }}</div>
    </div>

    <nav class="flex-1 px-4 py-6 space-y-1 overflow-y-auto">
      <a routerLink="/modules" class="flex items-center px-4 py-2 text-sm text-gray-300 hover:bg-gray-800 hover:text-white rounded-md transition-colors group">
        <span class="mr-3">⬅️</span>
        Back to Modules
      </a>
      
      <div class="pt-4 pb-2">
        <div class="text-xs uppercase text-gray-500 font-semibold tracking-wider px-4 mb-2">Menu</div>
      </div>
      
      <a *ngFor="let item of menuItems" 
         [routerLink]="item.route" 
         routerLinkActive="bg-indigo-600 text-white" 
         [routerLinkActiveOptions]="{exact: true}"
         class="flex items-center px-4 py-2 text-sm text-gray-300 hover:bg-gray-800 hover:text-white rounded-md transition-colors group">
        <span class="mr-3" *ngIf="item.icon">{{item.icon}}</span>
        {{item.label}}
      </a>
    </nav>
  </aside>

  <!-- Main Content -->
  <div class="flex-1 flex flex-col overflow-hidden">
    <!-- Header -->
    <header class="h-16 bg-white shadow-sm flex items-center justify-between px-8 z-10">
      <div class="flex items-center">
        <!-- Optional breadcrumbs or page title could go here -->
      </div>
      
      <div class="flex items-center space-x-4">
        <div class="text-sm font-medium text-gray-700">
          Welcome, {{ userName }}
        </div>
        <button (click)="logout()" class="text-sm text-red-600 hover:text-red-800 font-medium transition-colors">
          Logout
        </button>
      </div>
    </header>

    <!-- Page Content -->
    <main class="flex-1 overflow-y-auto p-8">
      <div class="max-w-7xl mx-auto">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
</div>
