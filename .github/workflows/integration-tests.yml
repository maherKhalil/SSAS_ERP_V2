# =====================================================================================================
# THE REAL-SQL INTEGRATION SUITE — MANUAL ONLY (CI-001).
# =====================================================================================================
#
# ---- WHY THIS IS NOT PART OF THE PULL-REQUEST GATE.
#
# It is 489 tests and roughly 79 minutes locally, most of it serialized real-SQL cutover and backup suites
# that create and drop databases one at a time. On a hosted runner it will be slower still. Putting that in
# front of every pull request would make the gate something people learn to wait out or work around, and a
# gate that is routinely bypassed protects nothing.
#
# The fast gate in ci.yml is the mandatory one. This is here so the suite CAN be run against a clean
# checkout on demand — before a release, or when a change reaches cutover, storage or routing behaviour.
#
# ---- IT USES EXACTLY THE MECHANISM THE FAST GATE PROVES.
#
# Same image, same SSAS_TEST_SQLSERVER override, same SQL authentication. Nothing here is a second way of
# reaching a database.
#
# ---- HONEST STATUS.
#
# This workflow has not yet been observed to complete a full run in GitHub Actions. The connection
# mechanism is shared with the fast gate, but the RUNTIME and stability of the long serialized suites on a
# hosted runner are unmeasured. Treat a first run as an experiment, not as a gate.
name: Integration tests (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Real-SQL integration suite
    runs-on: ubuntu-latest
    # Generously above the ~79-minute local run, because a hosted runner is slower and a timeout kill
    # would leave the result ambiguous rather than informative.
    timeout-minutes: 180

    services:
      # Ephemeral, job-scoped, and holding nothing but generated test databases. The password is not a
      # secret: see the note in ci.yml.
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Local_CI_Only_Pa55word!"
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        # ---- THE ONE DIRECTORY BOTH SIDES CAN REACH (CI-004).
        #
        # The backup and restore suites hand SQL Server a path and then inspect the resulting file
        # themselves, so the string has to mean the same thing to two processes. The test process runs on
        # the RUNNER; BACKUP, RESTORE and CREATE FILE are executed by sqlservr INSIDE this container. With
        # no shared mount those are different filesystems, which is why every one of them failed with
        # "Operating system error 5 (Access is denied)" against /usr/share/SSAS_BackupTests.
        #
        # Mounted at the SAME absolute path on both sides deliberately. Path identity here is engineered,
        # not assumed: a mount of host X to container Y would leave the tests passing a string that is only
        # valid on one side.
        volumes:
          - /var/opt/mssql/backup:/var/opt/mssql/backup

    env:
      SSAS_TEST_SQLSERVER: "Server=localhost,1433;User Id=sa;Password=Local_CI_Only_Pa55word!;TrustServerCertificate=True;Encrypt=False"

      # The seam the fixtures already offer. TestBackupRoot() reads this and otherwise falls back to
      # CommonApplicationData — C:\ProgramData on Windows, where a local SQL Server service can reach it,
      # and /usr/share on Linux, where a containerised one cannot. Pointing it at the shared mount is the
      # whole fix; no test code needed changing for it.
      SSAS_TEST_BACKUP_ROOT: /var/opt/mssql/backup
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore SSAS.ERP.sln

      - name: Build
        run: dotnet build SSAS.ERP.sln --configuration Debug --no-incremental --no-restore

      - name: Wait for SQL Server
        run: |
          # Same two probes as the fast gate; see ci.yml for why the TCP fallback exists.
          for attempt in $(seq 1 60); do
            if docker exec "${{ job.services.mssql.id }}" /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P "Local_CI_Only_Pa55word!" -C -Q "SELECT 1" > /dev/null 2>&1; then
              echo "SQL Server answered a query after ${attempt} attempt(s)."
              exit 0
            fi
            if (echo > /dev/tcp/127.0.0.1/1433) > /dev/null 2>&1; then
              echo "SQL Server is accepting TCP connections after ${attempt} attempt(s) (sqlcmd probe unavailable)."
              exit 0
            fi
            sleep 2
          done
          echo "::error::SQL Server did not become available within 120 seconds."
          exit 1

      # ---- BOTH PROCESSES MUST BE ABLE TO WRITE THE SHARED DIRECTORY.
      #
      # Docker creates the host side of the bind mount as root, which neither party can write. Inside the
      # container SQL Server runs as uid 10001 (`mssql`); on the runner the test process is uid 1001
      # (`runner`). A bind mount shares ownership metadata, so setting owner and group once here satisfies
      # both — 10001 owns it, 1001 has it as group.
      #
      # 0775 rather than 0777 on purpose: this grants exactly the two identities that need access, and the
      # directory holds nothing but generated .bak and .mdf files for the life of an ephemeral job.
      - name: Grant the shared backup directory to SQL Server and the runner
        run: |
          sudo mkdir -p /var/opt/mssql/backup
          sudo chown 10001:1001 /var/opt/mssql/backup
          sudo chmod 0775 /var/opt/mssql/backup
          ls -ld /var/opt/mssql/backup

      # ---- THE SQL CLIENT, FOR THE COMPETING-PROCESS TESTS ONLY.
      #
      # Three fixtures start a SEPARATE PROCESS that holds no application lock, to prove the backup guard
      # reacts to a backup it did not initiate. That genuinely needs an external client rather than another
      # connection from the test process, so sqlcmd is required rather than convenient. Nothing else here
      # uses it, and `bcp` and the rest of the toolset are not installed.
      - name: Install sqlcmd
        run: |
          set -euo pipefail

          # gpg runs as the RUNNER, not under sudo. Under sudo it tries to open /dev/tty, which does not
          # exist in a workflow step, and fails before writing anything.
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
            | gpg --batch --yes --dearmor --output /tmp/microsoft-prod.gpg
          sudo install -o root -g root -m 644 /tmp/microsoft-prod.gpg /usr/share/keyrings/microsoft-prod.gpg

          # The feed is chosen from the runner's OWN release rather than a hard-coded one, so a future
          # runner-image bump does not silently point at packages built for a different Ubuntu.
          . /etc/os-release
          echo "Runner: ${ID} ${VERSION_ID} (${VERSION_CODENAME})"
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/${ID}/${VERSION_ID}/prod ${VERSION_CODENAME} main" \
            | sudo tee /etc/apt/sources.list.d/mssql-release.list > /dev/null

          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18
          echo "/opt/mssql-tools18/bin" >> "$GITHUB_PATH"

      - name: Verify sqlcmd is on PATH
        run: sqlcmd -? > /dev/null && echo "sqlcmd available"

      - name: Integration.Tests
        run: >
          dotnet test tests/Integration.Tests/SSAS.Integration.Tests.csproj
          --configuration Debug --no-build
          --logger "trx;LogFileName=integration.trx"

      # ---- CLEANUP RUNS WHETHER OR NOT THE SUITE PASSED.
      #
      # The runner is ephemeral, so this cannot leak across jobs — but a cleanup that only ran on success
      # would hide a suite that leaves files behind, and that is worth seeing. Reported, never failed on:
      # a tidy-up problem must not turn a green suite red.
      - name: Report leftover backup artefacts
        if: always()
        run: |
          echo "Remaining files in the shared backup directory:"
          sudo find /var/opt/mssql/backup -type f | head -50
          echo "count: $(sudo find /var/opt/mssql/backup -type f | wc -l)"
          sudo rm -rf /var/opt/mssql/backup/* || true

      # Always, not only on failure. A run this expensive should leave its results behind whatever the
      # outcome — a green run's timings are the data that decides whether this can ever become automatic.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: "**/TestResults/*.trx"
          retention-days: 14
          if-no-files-found: ignore
