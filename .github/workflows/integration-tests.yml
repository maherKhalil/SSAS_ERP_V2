# =====================================================================================================
# THE REAL-SQL INTEGRATION SUITE — NIGHTLY AND ON DEMAND (CI-006).
# =====================================================================================================
#
# ---- WHY THIS IS NOT PART OF THE PULL-REQUEST GATE.
#
# It is 495 tests, most of it serialized real-SQL cutover and backup suites that create and drop databases
# one at a time. Hosted, that is around a quarter of an hour against a fast gate of roughly two minutes.
# Putting it in front of every pull request would make the gate something people learn to wait out or work
# around, and a gate that is routinely bypassed protects nothing.
#
# The fast gate in ci.yml stays the mandatory one.
#
# ---- IT USES EXACTLY THE MECHANISM THE FAST GATE PROVES.
#
# Same image, same SSAS_TEST_SQLSERVER override, same SQL authentication. Nothing here is a second way of
# reaching a database.
#
# ---- WHY NIGHTLY RATHER THAN PER-MERGE, FOR NOW.
#
# Three consecutive hosted runs on the same tree passed 495/495 with no infrastructure failure, so the
# suite is affordable to automate. Nightly is the trigger that earns the thing three runs cannot give:
# a continuous record. It also catches what no commit-triggered run would — this job pins neither
# `ubuntu-latest` nor `mssql/server:2022-latest`, and it installs sqlcmd from an external feed at runtime,
# so its environment drifts underneath it on days when nobody pushes anything.
#
# Adding a push-to-main trigger is the obvious next step once that record exists; it is deliberately not
# taken here, on three observations.
name: Integration tests (nightly and manual)

on:
  workflow_dispatch:
  schedule:
    # 03:00 UTC daily. Cron here is ALWAYS UTC — GitHub does not apply a repository timezone — so this is
    # written as the absolute time it fires rather than as anyone's local night.
    - cron: "0 3 * * *"

permissions:
  contents: read

# ---- ONE FULL SQL SUITE AT A TIME.
#
# Not for correctness: every run gets its own ephemeral runner and its own SQL container, so two runs share
# nothing and cannot corrupt each other. It is so a nightly firing on top of a manual investigation does not
# quietly burn a second quarter-hour of runner time and leave two results to reconcile.
#
# cancel-in-progress is FALSE on purpose. Cancelling a suite fourteen minutes into its backup and restore
# work destroys exactly the evidence the run exists to produce, and a cancelled run is not a datum — it is
# an ambiguity. The later run waits instead.
concurrency:
  group: integration-tests
  cancel-in-progress: false

jobs:
  integration:
    name: Real-SQL integration suite
    runs-on: ubuntu-latest
    # Generously above the ~79-minute local run, because a hosted runner is slower and a timeout kill
    # would leave the result ambiguous rather than informative.
    timeout-minutes: 180

    services:
      # Ephemeral, job-scoped, and holding nothing but generated test databases. The password is not a
      # secret: see the note in ci.yml.
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Local_CI_Only_Pa55word!"
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        # ---- THE ONE DIRECTORY BOTH SIDES CAN REACH (CI-004).
        #
        # The backup and restore suites hand SQL Server a path and then inspect the resulting file
        # themselves, so the string has to mean the same thing to two processes. The test process runs on
        # the RUNNER; BACKUP, RESTORE and CREATE FILE are executed by sqlservr INSIDE this container. With
        # no shared mount those are different filesystems, which is why every one of them failed with
        # "Operating system error 5 (Access is denied)" against /usr/share/SSAS_BackupTests.
        #
        # Mounted at the SAME absolute path on both sides deliberately. Path identity here is engineered,
        # not assumed: a mount of host X to container Y would leave the tests passing a string that is only
        # valid on one side.
        volumes:
          - /var/opt/mssql/backup:/var/opt/mssql/backup

    env:
      SSAS_TEST_SQLSERVER: "Server=localhost,1433;User Id=sa;Password=Local_CI_Only_Pa55word!;TrustServerCertificate=True;Encrypt=False"

      # The seam the fixtures already offer. TestBackupRoot() reads this and otherwise falls back to
      # CommonApplicationData — C:\ProgramData on Windows, where a local SQL Server service can reach it,
      # and /usr/share on Linux, where a containerised one cannot. Pointing it at the shared mount is the
      # whole fix; no test code needed changing for it.
      SSAS_TEST_BACKUP_ROOT: /var/opt/mssql/backup
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore SSAS.ERP.sln

      - name: Build
        run: dotnet build SSAS.ERP.sln --configuration Debug --no-incremental --no-restore

      - name: Wait for SQL Server
        run: |
          # Same two probes as the fast gate; see ci.yml for why the TCP fallback exists.
          for attempt in $(seq 1 60); do
            if docker exec "${{ job.services.mssql.id }}" /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P "Local_CI_Only_Pa55word!" -C -Q "SELECT 1" > /dev/null 2>&1; then
              echo "SQL Server answered a query after ${attempt} attempt(s)."
              exit 0
            fi
            if (echo > /dev/tcp/127.0.0.1/1433) > /dev/null 2>&1; then
              echo "SQL Server is accepting TCP connections after ${attempt} attempt(s) (sqlcmd probe unavailable)."
              exit 0
            fi
            sleep 2
          done
          echo "::error::SQL Server did not become available within 120 seconds."
          exit 1

      # ---- BOTH PROCESSES MUST BE ABLE TO WRITE THE SHARED DIRECTORY.
      #
      # Docker creates the host side of the bind mount as root, which neither party can write. Inside the
      # container SQL Server runs as uid 10001 (`mssql`); on the runner the test process is uid 1001
      # (`runner`). A bind mount shares ownership metadata, so setting owner and group once here satisfies
      # both — 10001 owns it, 1001 has it as group.
      #
      # 0775 rather than 0777 on purpose: this grants exactly the two identities that need access, and the
      # directory holds nothing but generated .bak and .mdf files for the life of an ephemeral job.
      - name: Grant the shared backup directory to SQL Server and the runner
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq acl > /dev/null

          sudo mkdir -p /var/opt/mssql/backup
          sudo chown 10001:1001 /var/opt/mssql/backup
          sudo chmod 2775 /var/opt/mssql/backup

          # ---- THE SUBDIRECTORIES ARE THE PART THAT MATTERS.
          #
          # Permissions on the root alone are not enough. Each fixture creates its own
          # <root>/<guid>/ directory, and it is the TEST PROCESS that creates it — so the directory lands
          # owned by the runner with a default mask that leaves SQL Server only "other" rights. sqlservr
          # then cannot write src.mdf or a .bak inside it, which is the second access-denied wave.
          #
          # A DEFAULT ACL is inherited by everything created underneath, so both identities keep access no
          # matter which of them creates a directory. Named users rather than 0777: exactly the two
          # principals that need it, and nothing else on the machine.
          sudo setfacl -m u:10001:rwx -m u:1001:rwx /var/opt/mssql/backup
          sudo setfacl -d -m u:10001:rwx -m u:1001:rwx -m o::rx /var/opt/mssql/backup

          ls -ld /var/opt/mssql/backup
          getfacl -p /var/opt/mssql/backup

      # ---- THE SQL CLIENT, FOR THE COMPETING-PROCESS TESTS ONLY.
      #
      # Three fixtures start a SEPARATE PROCESS that holds no application lock, to prove the backup guard
      # reacts to a backup it did not initiate. That genuinely needs an external client rather than another
      # connection from the test process, so sqlcmd is required rather than convenient. Nothing else here
      # uses it, and `bcp` and the rest of the toolset are not installed.
      - name: Install sqlcmd
        timeout-minutes: 10
        run: |
          set -euo pipefail

          # ---- EVERY NETWORK OPERATION HERE IS RETRIED; NOTHING ELSE IS (CI-008).
          #
          # This step is the one part of the job that reaches outside GitHub and the container registry, so
          # it is the one part that can fail for reasons the repository does not control. A nightly that goes
          # red because a CDN dropped one connection is noise, and noise is how a scheduled job stops being
          # read.
          #
          # Three attempts with 5s then 15s backoff. Bounded deliberately: the point is to survive a blip,
          # not to sit through an outage — the ten-minute step timeout above is the outer bound either way.
          #
          # THE FINAL FAILURE IS STILL FATAL. `set -e` plus a non-zero return here fails the step, which
          # fails the job. There is no `continue-on-error` and no fallback that would let the suite run
          # without sqlcmd: the three competing-process tests would then fail one by one for a reason that
          # looks like a backup defect. A clearly-labelled provisioning failure is worth far more.
          #
          # Nothing downstream is retried. Not the build, not `dotnet test`, not a SQL assertion — a flaky
          # retry around a test is how a real defect gets buried.
          retry() {
            local label="$1"
            shift

            local attempt=1 delay=5
            while true; do
              if "$@"; then
                return 0
              fi

              if [ "${attempt}" -ge 3 ]; then
                echo "::error::${label} failed after ${attempt} attempts."
                return 1
              fi

              echo "${label} failed on attempt ${attempt}; retrying in ${delay}s."
              sleep "${delay}"
              attempt=$((attempt + 1))
              delay=$((delay * 3))
            done
          }

          # Fetch and dearmor are separate operations now. Piped together, `curl` failing left `gpg` to
          # dearmor an empty stream, so the error surfaced as a confusing keyring problem rather than as the
          # download failure it was.
          #
          # curl does its own bounded retry as well — closest to the socket, so it recovers from a reset
          # without discarding the whole attempt. `--retry-all-errors` is needed because a bare `--retry`
          # ignores connection failures, which is exactly the case worth retrying.
          fetch_microsoft_key() {
            curl -fsSL --connect-timeout 15 --max-time 120 \
              --retry 3 --retry-delay 5 --retry-all-errors \
              https://packages.microsoft.com/keys/microsoft.asc --output /tmp/microsoft.asc
          }

          retry "Microsoft signing key download" fetch_microsoft_key

          # gpg runs as the RUNNER, not under sudo. Under sudo it tries to open /dev/tty, which does not
          # exist in a workflow step, and fails before writing anything.
          gpg --batch --yes --dearmor --output /tmp/microsoft-prod.gpg /tmp/microsoft.asc
          sudo install -o root -g root -m 644 /tmp/microsoft-prod.gpg /usr/share/keyrings/microsoft-prod.gpg

          # The feed is chosen from the runner's OWN release rather than a hard-coded one, so a future
          # runner-image bump does not silently point at packages built for a different Ubuntu.
          . /etc/os-release
          echo "Runner: ${ID} ${VERSION_ID} (${VERSION_CODENAME})"
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/${ID}/${VERSION_ID}/prod ${VERSION_CODENAME} main" \
            | sudo tee /etc/apt/sources.list.d/mssql-release.list > /dev/null

          # ---- ONLY THE MICROSOFT FEED IS REFRESHED.
          #
          # A bare `apt-get update` also refreshes the Ubuntu mirrors, and one run sat on
          # azure.archive.ubuntu.com for over two minutes before failing over to archive.ubuntu.com — enough
          # to burn the step timeout on a mirror outage that has nothing to do with this repository.
          #
          # The runner image ships current Ubuntu package lists; the `acl` install above resolves from them
          # with no update at all, which is the evidence that dependencies still resolve. List-Cleanup is off
          # so refreshing one list does not discard the others.
          #
          # Acquire::Retries is apt's OWN download retry, and apt's timeouts are set explicitly rather than
          # left at whatever the image defaults to. Both are preferable to wrapping apt in `timeout`: killing
          # apt mid-transaction can leave dpkg locked or half-configured, and the retry would then fail on
          # the lock rather than on the thing that actually went wrong.
          apt_update_microsoft_feed() {
            sudo apt-get update -o Dir::Etc::sourcelist="sources.list.d/mssql-release.list" \
              -o Dir::Etc::sourceparts="-" -o APT::Get::List-Cleanup="0" \
              -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          }

          retry "Microsoft feed metadata refresh" apt_update_microsoft_feed

          # ---- THE EULA IS ANSWERED BEFORE apt IS ASKED.
          #
          # mssql-tools18 prompts for licence acceptance through debconf. `sudo ACCEPT_EULA=Y apt-get …`
          # looks like it answers that, but sudo strips the variable from the environment it passes on, so
          # the prompt still appears — and with no terminal the step does not fail, it HANGS. One run sat on
          # it for 38 minutes before being cancelled.
          #
          # Preseeding the answer removes the question entirely, and DEBIAN_FRONTEND=noninteractive is
          # carried through `sudo env` rather than assumed.
          echo 'mssql-tools18 mssql-tools/accept_eula boolean true' | sudo debconf-set-selections

          # ---- NOT PINNED TO A VERSION, ON PURPOSE.
          #
          # Pinning `mssql-tools18=18.6.2.1-1` would buy determinism and sell a worse failure: when Microsoft
          # eventually drops that build from the pool, the nightly breaks PERMANENTLY and for a reason nobody
          # is watching for, which is strictly worse than the transient this step is hardening against. The
          # tool is used only to run BACKUP DATABASE from a process the suite does not own, so any 18.x does
          # the job.
          #
          # The installed version is printed instead, so if a future release ever does change behaviour, the
          # log says which build ran rather than leaving it to be guessed.
          apt_install_sqlcmd() {
            sudo env DEBIAN_FRONTEND=noninteractive ACCEPT_EULA=Y \
              apt-get install -y --no-install-recommends \
              -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
              mssql-tools18
          }

          retry "mssql-tools18 installation" apt_install_sqlcmd

          echo "/opt/mssql-tools18/bin" >> "$GITHUB_PATH"

      # Failing here rather than inside the suite. Without this, a provisioning problem surfaces as three
      # backup tests failing on a process that would not start, which reads like a defect in the guard they
      # exercise.
      - name: Verify sqlcmd is on PATH
        run: |
          set -euo pipefail
          echo "mssql-tools18: $(dpkg-query -W -f='${Version}' mssql-tools18)"
          echo "msodbcsql18:  $(dpkg-query -W -f='${Version}' msodbcsql18)"
          sqlcmd -? > /dev/null
          echo "sqlcmd available"

      - name: Integration.Tests
        run: >
          dotnet test tests/Integration.Tests/SSAS.Integration.Tests.csproj
          --configuration Debug --no-build
          --logger "trx;LogFileName=integration.trx"

      # ---- CLEANUP RUNS WHETHER OR NOT THE SUITE PASSED.
      #
      # The runner is ephemeral, so this cannot leak across jobs — but a cleanup that only ran on success
      # would hide a suite that leaves files behind, and that is worth seeing. Reported, never failed on:
      # a tidy-up problem must not turn a green suite red.
      - name: Report leftover backup artefacts
        if: always()
        run: |
          echo "Remaining files in the shared backup directory:"
          sudo find /var/opt/mssql/backup -type f | head -50
          echo "count: $(sudo find /var/opt/mssql/backup -type f | wc -l)"
          sudo rm -rf /var/opt/mssql/backup/* || true

      # Always, not only on failure. A run this expensive should leave its results behind whatever the
      # outcome — a green run's timings are the data that decides whether this can ever become automatic.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: "**/TestResults/*.trx"
          retention-days: 14
          if-no-files-found: ignore
